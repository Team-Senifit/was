spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: was
    maximum-sessions: 20

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    pbkdf2_pepper: ${PBKDF2_PEPPER}

  jpa:
    database: mysql
    hibernate:
#      ddl-auto: create
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQL8Dialect

  logging:
    level:
      root: info

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASS}

  session:
    store-type: redis
    timeout: 1800s