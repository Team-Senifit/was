spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: was
    maximum-sessions: 20

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    pbkdf2_pepper: ${PBKDF2_PEPPER}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

  logging:
    level:
      root: info

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASS}

  session:
    store-type: redis
    timeout: 5400s

# 프로메테우스 메트릭 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:default}
  prometheus:
    metrics:
      export:
        enabled: true

# HTTPS 설정
server:
  port: ${SERVER_PORT}
  ssl:
    enabled: ${SSL_ENABLED}
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    #key-alias: ${SSL_CERT_ALIAS}
  # 프록시 헤더 처리
  forward-headers-strategy: framework

app:
  s3:
    # 리전은 .env의 AWS_REGION을 우선 사용(없으면 ap-northeast-2)
    region: ${AWS_REGION}

    # 버킷/프리픽스는 .env로 덮어쓰기 가능
    bucket: ${S3_BUCKET}
    video-prefix: ${S3_VIDEO_PREFIX}
    thumb-prefix: ${S3_THUMB_PREFIX}

    presign:
      # 프리사인드 URL 만료(초) — 영상 전체 재생 고려해서 충분히 줘야 함
      expiry-seconds: ${S3_PRESIGN_EXPIRY:7200}       # 2시간
      # 브라우저 동작: inline(스트리밍) / attachment(다운로드)
      content-disposition: ${S3_PRESIGN_CONTENT_DISPOSITION:inline}
      # 업로드 때 저장된 Content-Type을 응답 헤더에 강제 반영할지 여부
      force-content-type: ${S3_PRESIGN_FORCE_CONTENT_TYPE:false}
