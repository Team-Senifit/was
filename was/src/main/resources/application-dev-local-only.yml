# 로컬 Docker 개발 환경 설정
# 사용법: ./gradlew bootRun --args='--spring.profiles.active=dev-local'
# 사전 조건: cd src/dev && docker compose up -d

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:cert/localhost.p12
    key-store-type: PKCS12
    key-store-password: '!senifit0527@'
    key-alias: localhost

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dev?rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: senifit
    password: '!senifiT2025'
    pbkdf2_pepper: 8ZvnK2f7CYVU/UEXT55uE1VeVdbzqGm7okaUwmOZaUIc6Sb/Cv310TI3GFRz+CqB7GbgCzM/EPskIqoP+OwK7A==

  jpa:
    database: mysql
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379
      password: '!senifiT2025'

  session:
    store-type: redis
    timeout: 5400s

app:
  s3:
    region: ap-northeast-2
    bucket: senifit-program-bk
    video-prefix: video/
    thumb-prefix: thumb/
    presign:
      expiry-seconds: 7200
      content-disposition: inline
      force-content-type: false

logging:
  level:
    root: info
    com.senifit: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
